# GRID · atualiza a base de CAs do Ministério do Trabalho (tabela epi_ca) toda segunda-feira às 06:17 (Brasília)
# Precisa do segredo SUPABASE_SERVICE_ROLE_KEY (Settings → Secrets and variables → Actions).
# Para rodar na hora: aba Actions → "Base de CAs (CAEPI)" → Run workflow.
name: Base de CAs (CAEPI)
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar e gravar
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/caepi.py
